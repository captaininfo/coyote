name: coyote

x-health: &webcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  database:
    image: neo4j:5.26
    profiles: ["core","agent"]
    ports:
      - "${NEO4J_HTTP_PORT-7474}:7474"
      - "${NEO4J_BOLT_PORT-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
      - NEO4J_PLUGINS=["apoc"]
      # Restrict APOC to only procedures Coyote uses (apoc.meta.schema, apoc.convert.fromJsonList)
      - NEO4J_dbms_security_procedures_unrestricted=apoc.meta.*,apoc.convert.*
    volumes:
      - ${NEO4J_DATA_DIR-./volumes/neo4j}:/data
    healthcheck:
      # Neo4j image has busybox wget; if not, switch to curl.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]

  llm:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT-11434}:11434"
    environment:
      - OLLAMA_ORIGINS=*
      # Expose the target model inside this service so the healthcheck can reference it.
      - LLM=${LLM-qwen2.5-coder:3b}
    volumes:
      - ${COYOTE_MODELS_DIR-./volumes/ollama}:/root/.ollama
    # Option B: "healthy" only when the model is present *and* the server is responding.
    # `ollama show` returns non-zero when the model is missing, so health stays "starting/unhealthy"
    # until pull-model completes.
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$LLM\" >/dev/null 2>&1"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]

  #llm-gpu:
    #extends: llm
    #profiles: ["llm-gpu"]
    #deploy:
      #resources:
        #reservations:
          #devices:
            #- driver: nvidia
              #count: all
              #capabilities: [gpu]

  coyote_app:
    # Local dev build from images/core/core_analysis/
    # For production: replace with image: ghcr.io/captaininfo/coyote-core:latest
    build:
      context: ../images/core/core_analysis
      dockerfile: ../Dockerfile
    image: coyote-core:local
    profiles: ["core"]
    ports:
      - "${COYOTE_PORT-5000}:5000"
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=${NEO4J_URI-bolt://database:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - COYOTE_DATA_DIR=/app/data
      - COYOTE_LOG_LEVEL=${COYOTE_LOG_LEVEL-INFO}
      - FLASK_DEBUG=${FLASK_DEBUG-0}
      - SENTENCE_TRANSFORMERS_HOME=/opt/embedding_model
      - TOPIC_SCORE_THRESHOLD=${TOPIC_SCORE_THRESHOLD:-0.10}
    volumes:
      - ${COYOTE_USER_DATA-./volumes/coyote}:/app/data
    healthcheck:
      # Use Python inside the image (no curl/wget dependency)
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:5000/health', timeout=3)\nexcept Exception:\n  sys.exit(1)\nPY"]
      <<: *webcheck
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks: [coyote_net]

  bot:
    # Image built from images/agent/bot.Dockerfile and published to GHCR
    # For production: uncomment the image line and comment the build block:
    # image: ${BOT_IMAGE-ghcr.io/captaininfo/coyote-bot:0.4.0}
    build:
      context: ../images/agent
      dockerfile: bot.Dockerfile
    profiles: ["agent"]
    ports:
      - "${BOT_PORT-8501}:8501"
    environment:
      - NEO4J_URI=${NEO4J_URI-neo4j://database:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://llm:11434}
      - LLM=${LLM-qwen2.5-coder:3b}
      - AGENT_LOG_DIR=/app/logs
      - AGENT_LOG_LEVEL=DEBUG
      - USE_LC_NL2CYPHER=0
      - SENTENCE_TRANSFORMERS_HOME=/opt/embedding_model
      - VECTOR_SIMILARITY_THRESHOLD=${VECTOR_SIMILARITY_THRESHOLD:-0.40}
    volumes:
      - ${AGENT_LOG_DIR-./volumes/agent_logs}:/app/logs
    depends_on:
      # Bot waits for Neo4j *and* the LLM model to be present
      database:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8501/_stcore/health || exit 1"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]


networks:
  coyote_net:
