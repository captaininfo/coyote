name: coyote

x-health: &webcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  database:
    image: neo4j:5.26
    profiles: ["core","agent"]
    ports:
      - "${NEO4J_HTTP_PORT-7474}:7474"
      - "${NEO4J_BOLT_PORT-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ${NEO4J_DATA_DIR-./volumes/neo4j}:/data
    healthcheck:
      # Neo4j image has busybox wget; if not, switch to curl.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]

  llm:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT-11434}:11434"
    environment:
      - OLLAMA_ORIGINS=*
    volumes:
      - ${COYOTE_MODELS_DIR-./volumes/ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]

  llm-gpu:
    extends: llm
    profiles: ["llm-gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  coyote_app:
    # Build the local app image from the source in ../../Coyote_v2 and tag it as coyote:latest
    # Once Coyote is launched, pull the published image from ghcr.io/captaininfo/coyote:latest
    image: coyote:latest
    build:
      context: ../../Coyote_v2
      dockerfile: Dockerfile
    profiles: ["core"]
    ports:
      - "${COYOTE_PORT-5000}:5000"
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=${NEO4J_URI-bolt://database:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - COYOTE_DATA_DIR=/app/data
    volumes:
      - ${COYOTE_USER_DATA-./volumes/coyote}:/app/data
    healthcheck:
      # Use Python inside the image (no curl/wget dependency)
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:5000/health', timeout=3)\nexcept Exception:\n  sys.exit(1)\nPY"]
      <<: *webcheck
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks: [coyote_net]

  bot:
    # Option A: build from your agent Dockerfile (matches your repo)
    build:
      context: ../images/agent
      dockerfile: bot.Dockerfile
    # Option B: if you later publish, replace with an image: tag
    profiles: ["agent"]
    ports:
      - "${BOT_PORT-8501}:8501"
    environment:
      - NEO4J_URI=${NEO4J_URI-neo4j://database:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://llm:11434}
      - LLM=${LLM-phi3:mini}
    volumes:
      - ${EMBEDDING_MODEL_DIR-./volumes/embedding_model}:/embedding_model
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8501/_stcore/health || exit 1"]
      <<: *webcheck
    restart: unless-stopped
    networks: [coyote_net]

  pull-model:
    image: ollama/ollama:latest
    profiles: ["llm"]
    depends_on:
      llm:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://llm:11434
    entrypoint: ["/bin/sh","-lc","ollama pull ${LLM-phi3:mini}"]
    networks: [coyote_net]
    restart: "no"


networks:
  coyote_net:
