<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="coyote-new-tab" content="1"/>
  <title>Coyote New Tab</title>
  <link rel="stylesheet" href="/static/css/new_tab.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Welcome to Coyote</h1>
      <p>Define your purpose, add keywords, and explore.</p>
    </header>

    <section class="search-setup">
      <form id="searchForm" novalidate>
        <div class="purpose-of-search">
          <label for="purposeInput">Purpose of search:</label>
          <p>Helps Coyote connect searches to your goals.</p>
          <input type="text" id="purposeInput" placeholder="e.g., Plan trip to Glacier National Park"/>

          <div class="recent-purposes">
            <label for="recent-purposes">Recent</label>
            <p>Your recent purposes will appear here for quick reuse.</p>
            <ul id="recentPurposesList"></ul>
          </div>
        </div>

        <div class="search-terms" style="margin-top:16px;">
          <label for="searchTermsInput">Search Terms:</label>
          <input type="text" id="searchTermsInput" placeholder="Enter keywords or a full question..."/>
        </div>

        <button id="searchButton" disabled style="margin-top:16px;">Search</button>
      </form>
    </section>
  </div>

  <script src="/static/js/new_tab_ui.js"></script>
</body>
</html>
